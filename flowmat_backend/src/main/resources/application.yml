spring:
  application:
    name: flowmat
  profiles:
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 2000
      timeout: 2000
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:3600}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}

server:
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

app:
  frontend-url: ${FRONTEND_URL}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  workflow-collab:
    graph:
      retention: ${APP_WORKFLOW_COLLAB_GRAPH_RETENTION:P31D}
      key-ttl: ${APP_WORKFLOW_COLLAB_GRAPH_KEY_TTL:P35D}
    presence:
      heartbeat-timeout: ${APP_WORKFLOW_COLLAB_PRESENCE_HEARTBEAT_TIMEOUT:PT45S}
      cleanup-interval: ${APP_WORKFLOW_COLLAB_PRESENCE_CLEANUP_INTERVAL:PT15S}

logging:
  level:
    org.hibernate.SQL: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%X{userId:-anon}] [%X{projectId:-no-project}] [%X{workflowId:-no-workflow}] [%X{runId:-no-run}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# OAuth2 provider templates.
# Enable a provider by setting its env vars.
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET
# GOOGLE_REDIRECT_URI / KAKAO_REDIRECT_URI
