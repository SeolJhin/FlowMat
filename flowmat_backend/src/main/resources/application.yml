spring:
  application:
    name: flowmat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowmat}
    username: ${DB_USERNAME:flowmat}
    password: ${DB_PASSWORD:flowmat}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2000
      timeout: 2000

jwt:
  secret: ${JWT_SECRET:flowmat-local-dev-secret-key-32bytes!!}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:3600}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}

server:
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: debug
