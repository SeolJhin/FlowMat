services:
  redis:
    image: 'redis:7.4'
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: flowmat
      POSTGRES_USER: flowmat
      POSTGRES_PASSWORD: flowmat
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowmat -d flowmat']
      interval: 10s
      timeout: 5s
      retries: 5
