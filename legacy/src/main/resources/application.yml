spring:
  application:
    name: flowmat
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  servlet:
    context-path: /api

logging:
  level:
    org.hibernate.SQL: debug
