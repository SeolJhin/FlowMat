name: Security Scan - Dependencies

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_frontend

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate

    - name: Check for vulnerabilities
      run: npm audit fix --dry-run

  gradle-dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_backend

    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Run Gradle dependency check
      run: ./gradlew dependencyCheckAnalyze

    - name: Upload SBOM report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-check-report
        path: build/reports/dependency-check-report.html
        if-no-files-found: ignore

  dependabot-setup:
    runs-on: ubuntu-latest
    
    steps:
    - name: ✅ Dependabot configuration check
      run: echo "Dependabot should be configured in GitHub repository settings"
    
    - name: ℹ️ Configuration steps
      run: |
        echo "1. Go to Settings → Code security and analysis"
        echo "2. Enable 'Dependabot alerts'"
        echo "3. Enable 'Dependabot security updates'"
        echo "4. Create .github/dependabot.yml for version updates"
