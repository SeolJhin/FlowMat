name: Browser E2E with Backend Services

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowmat
          POSTGRES_USER: flowmat
          POSTGRES_PASSWORD: flowmat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmat -d flowmat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: flowmat_frontend/package-lock.json

      - name: Start backend
        working-directory: flowmat_backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/flowmat
          DB_USERNAME: flowmat
          DB_PASSWORD: flowmat-ci-password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          MAIL_HOST: localhost
          MAIL_PORT: '2525'
          MAIL_USERNAME: ci
          MAIL_PASSWORD: ci-password
          JWT_SECRET: ci-secret-that-is-long-enough-for-tests
          FRONTEND_URL: http://127.0.0.1:4173
          APP_OAUTH2_REDIRECT_URI: http://127.0.0.1:4173/oauth2/success
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=dev --server.port=8080' > /tmp/flowmat-backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flowmat-backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: flowmat_frontend
        run: npm ci

      - name: Verify backend API contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/actuator/health/readiness

      - name: Install Playwright browser
        working-directory: flowmat_frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend contract E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/backend-contract.spec.ts

      - name: Run browser E2E
        working-directory: flowmat_frontend
        run: npm run test:e2e

      - name: Run real BOM and LOT E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/bom-lot-flow.spec.ts

      - name: Run real LOT genealogy E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/lot-genealogy.spec.ts

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-backend-log
          path: /tmp/flowmat-backend.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-playwright-artifacts
          path: |
            flowmat_frontend/test-results
            flowmat_frontend/playwright-report
          if-no-files-found: ignore
