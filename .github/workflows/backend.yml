name: Backend Tests & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_backend

    # Integration tests (FlowMatSmokeTest, ProjectAccessIntegrationTest) start their own Postgres and
    # Redis through Testcontainers using the runner's Docker, so no service containers are needed here.
    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Run tests
      run: ./gradlew test

    - name: Build
      run: ./gradlew build -x test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: flowmat_backend/build/reports/jacoco/test/jacocoTestReport.xml
        flags: backend
        fail_ci_if_error: false
