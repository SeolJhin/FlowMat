name: Frontend Tests & Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_frontend

    strategy:
      matrix:
        # Vite 8 and Vitest 5 require Node >=22.12.0.
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: flowmat_frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit -p tsconfig.json

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Install Playwright browser
      if: matrix.node-version == '22.x'
      run: npx playwright install --with-deps chromium

    - name: Run mocked authentication E2E
      if: matrix.node-version == '22.x'
      run: npm run test:e2e -- e2e/auth.spec.ts
